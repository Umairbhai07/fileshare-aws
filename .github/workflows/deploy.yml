name: Deploy

# Ships a new version to an environment created with `make deploy`.
# Setup (once): run Terraform with github_repo set, then add to the repo:
#   Secret   AWS_DEPLOY_ROLE_ARN          = terraform output github_deploy_role_arn
#   Variable AWS_REGION                   = terraform output region
#   Variable PROJECT                      = sharebox (your `project` variable)
#   Variable ECR_REPOSITORY_URL           = terraform output ecr_repository_url
#   Variable ASG_NAME                     = terraform output asg_name
#   Variable FRONTEND_BUCKET              = terraform output frontend_bucket
#   Variable CLOUDFRONT_DISTRIBUTION_ID   = terraform output cloudfront_distribution_id

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC: exchange a GitHub token for short-lived AWS credentials

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.ECR_REPOSITORY_URL != ''
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      PROJECT: ${{ vars.PROJECT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}
            ${{ vars.ECR_REPOSITORY_URL }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Lambdas
        run: |
          npm run build:lambdas
          for fn in share-api process-upload expiry-stream sweeper; do
            (cd lambdas/dist/$fn && zip -qr ../../../$fn.zip .)
            aws lambda update-function-code --function-name "$PROJECT-$fn" --zip-file "fileb://$fn.zip" --query 'LastUpdateStatus' --output text
          done

      - name: Deploy frontend
        run: |
          aws s3 sync frontend/ "s3://${{ vars.FRONTEND_BUCKET }}/" --delete --exclude config.js \
            --cache-control "public, max-age=300"
          aws s3 cp frontend/index.html "s3://${{ vars.FRONTEND_BUCKET }}/index.html" --cache-control no-cache --content-type "text/html; charset=utf-8"
          aws s3 cp frontend/share.html "s3://${{ vars.FRONTEND_BUCKET }}/share.html" --cache-control no-cache --content-type "text/html; charset=utf-8"
          aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*" --query 'Invalidation.Id' --output text

      - name: Roll the EC2 fleet (rolling instance refresh, 50% min healthy)
        run: |
          ID=$(aws autoscaling start-instance-refresh --auto-scaling-group-name "${{ vars.ASG_NAME }}" \
            --preferences '{"MinHealthyPercentage":50,"InstanceWarmup":120}' --query InstanceRefreshId --output text)
          echo "Instance refresh $ID started"
          for i in $(seq 1 60); do
            STATUS=$(aws autoscaling describe-instance-refreshes --auto-scaling-group-name "${{ vars.ASG_NAME }}" \
              --instance-refresh-ids "$ID" --query 'InstanceRefreshes[0].Status' --output text)
            echo "$(date +%T) $STATUS"
            case "$STATUS" in
              Successful) exit 0 ;;
              Failed|Cancelled|RollbackSuccessful|RollbackFailed) exit 1 ;;
            esac
            sleep 20
          done
          echo "Timed out waiting for the instance refresh"; exit 1
