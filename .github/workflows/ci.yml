name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:lambdas

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build Lambdas (validate reads their zips)
        working-directory: .
        run: npm ci && npm run build:lambdas
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  docker:
    name: Docker build + scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          load: true
          tags: sharebox-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: |
          docker run -d --name api -p 8080:8080 -e MODE=local sharebox-api:ci
          for i in $(seq 1 20); do curl -fs localhost:8080/health && exit 0; sleep 1; done
          docker logs api; exit 1
      - name: Scan for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: sharebox-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0' # report only; set to '1' to fail the build
